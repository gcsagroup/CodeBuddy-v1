<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>小熊猫 · 自然动作样板</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f7f4ee;
        color: #342a22;
        font:
          15px/1.65 'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
      }
      main {
        max-width: 1060px;
        margin: auto;
        padding: 38px 32px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .eyebrow {
        font: 11px/1.5 monospace;
        letter-spacing: 0.15em;
        color: #887462;
      }
      h1 {
        font-size: 29px;
        letter-spacing: -0.04em;
        margin: 7px 0;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #807465;
      }
      .badge {
        border: 1px solid #dcd4c7;
        padding: 5px 12px;
        border-radius: 99px;
        font-size: 12px;
        white-space: nowrap;
      }
      .stage {
        position: relative;
        display: grid;
        place-items: center;
        height: 440px;
        margin: 28px 0 18px;
        border: 1px solid #e3dcd0;
        border-radius: 24px;
        background: radial-gradient(ellipse at 50% 62%, #fffdf9 0%, #f0ebe1 100%);
        overflow: hidden;
      }
      .stage::before {
        content: '';
        position: absolute;
        width: 420px;
        height: 1px;
        background: linear-gradient(90deg, transparent, #d8d0bf, transparent);
        top: 385px;
      }
      canvas {
        position: relative;
        touch-action: none;
      }
      .caption {
        position: absolute;
        left: 22px;
        top: 18px;
        color: #9b8b79;
        font-size: 12px;
      }
      .hint {
        position: absolute;
        bottom: 17px;
        font-size: 12px;
        color: #968874;
      }
      .controls {
        display: flex;
        gap: 9px;
        justify-content: center;
        flex-wrap: wrap;
      }
      button {
        border: 1px solid #dbd2c4;
        border-radius: 12px;
        background: #fffcf7;
        color: #66523e;
        padding: 10px 24px;
        font: inherit;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: #eee5d8;
      }
      button[aria-pressed='true'] {
        background: #66503a;
        border-color: #66503a;
        color: #fffaf3;
      }
      .options {
        display: flex;
        justify-content: center;
        gap: 26px;
        margin: 19px 0 25px;
        font-size: 12px;
        color: #7c6c58;
      }
      input {
        accent-color: #73583d;
        vertical-align: middle;
      }
      .details {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid #e1d9cc;
        padding-top: 18px;
        gap: 28px;
      }
      .details strong {
        font-size: 13px;
        font-weight: 600;
      }
      .details p {
        margin-top: 5px;
        font-size: 12px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 26px;
        color: #9b8b79;
        font-size: 11px;
      }
      #metrics {
        font-variant-numeric: tabular-nums;
      }
      #error {
        color: #a23e29;
      }
      @media (max-width: 650px) {
        main {
          padding: 24px 16px;
        }
        h1 {
          font-size: 24px;
        }
        header {
          align-items: flex-start;
        }
        .details {
          grid-template-columns: 1fr;
          gap: 14px;
        }
        footer {
          flex-direction: column;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="eyebrow">CODEBUDDY / MOTION STUDY 01</div>
          <h1>小熊猫，慢慢活起来。</h1>
          <p>安静地陪伴，偶尔回应你一下。</p>
        </div>
        <span class="badge">自然动作 · 样板</span>
      </header>
      <section class="stage" aria-label="小熊猫动作预览">
        <span class="caption">RED PANDA · ORIGINAL CHARACTER</span>
        <canvas role="img" aria-label="小熊猫分层动画"></canvas>
        <span class="hint" id="hint">正在准备小熊猫…</span>
      </section>
      <div class="controls" aria-label="选择动作">
        <button data-action="idle" aria-pressed="true">待机</button>
        <button data-action="look" aria-pressed="false">观察</button>
        <button data-action="wave" aria-pressed="false">挥手</button>
        <button data-action="jump" aria-pressed="false">跳跃</button>
      </div>
      <div class="options">
        <label><input type="checkbox" id="auto" /> 自动演示</label
        ><label><input type="checkbox" id="reduced" /> 减少动画</label
        ><label><input type="checkbox" id="small" /> 桌面实际大小</label>
      </div>
      <div class="details">
        <div>
          <strong>轻一点的待机</strong>
          <p>脚掌不动，小幅呼吸、偶尔眨眼，尾巴轻轻跟随。</p>
        </div>
        <div>
          <strong>有分寸的回应</strong>
          <p>观察时移动鼠标；挥手后收回，连续点击也能自然衔接。</p>
        </div>
        <div>
          <strong>有重量的跳跃</strong>
          <p>先蓄力，再起跳，落地后缓冲，最后恢复站姿。</p>
        </div>
      </div>
      <footer>
        <span>独立样板，尚未替换正式桌宠。</span><span id="metrics">正在采样帧率…</span>
      </footer>
      <p id="error" role="alert"></p>
    </main>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
