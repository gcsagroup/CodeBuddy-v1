packages:
  - 'sdk'
  - 'text'
  - 'desktop'
  - 'goose-binary/*'

registry: https://registry.npmjs.org/
preferOffline: true
nodeLinker: hoisted
supportedArchitectures:
  os: [current, linux, darwin, win32]
  cpu: [current, x64, arm64]
overrides:
  react: ^19.2.4
  react-dom: ^19.2.4
  shell-quote: 1.10.0
  fast-uri: 3.1.4
  hono: 4.12.27
  'js-yaml@>=4.0.0': 4.3.0
  lodash: 4.18.1
  path-to-regexp: 8.4.0
  react-router: 7.15.1
  ws: 8.21.0
  tar: 7.5.21
  '@hono/node-server': 2.0.11
  ip-address: 10.1.1
  qs: 6.15.2
  uuid: 13.0.1
  'yaml@<2': 1.10.3
  'yaml@>=2': 2.8.3
  body-parser: 2.3.0
  '@xmldom/xmldom@0.8': 0.8.13
  'brace-expansion@1': 1.1.16
  'brace-expansion@2': 2.1.2
  'brace-expansion@5': 5.0.7
  'defu@6': 6.1.5
  'flatted@3': 3.4.2
  'js-yaml@3': 3.15.0
  'picomatch@2': 2.3.2
  'picomatch@4': 4.0.4
  'external-editor@3>tmp': 0.2.7
  'tmp-promise@3>tmp': 0.2.7
  'undici@7': 7.28.0
  'smol-toml@1': 1.6.1
allowBuilds:
  '@modelcontextprotocol/ext-apps': true
  electron: true
  electron-winstaller: true
  esbuild: true
  node-pty: true
# Electron Forge resolves @electron/node-gyp from git.
blockExoticSubdeps: false
